services:
  sawed-off-socials:
    build: .
    image: sawed-off-socials:latest
    container_name: sawed-off-socials
    ports:
      - "8000:8000"
    # Secrets and settings come from .env (copy .env.example and fill it in).
    env_file:
      - .env
    volumes:
      # One folder holds everything the app remembers between restarts:
      # uploads/, event_details.json, google_token.json, custom_emails.json
      - ./data:/data
    restart: unless-stopped
